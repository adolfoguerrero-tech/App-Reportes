<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentamaq Master v3.8 - Analista Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f6f8;color:#1a1a1a;font-size:12px}
        .nav{background:#1F4E78;color:#fff;padding:12px 20px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:50}
        .nav button{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:8px 12px;border-radius:6px;cursor:pointer}
        .nav button.active{background:#fff;color:#1F4E78;font-weight:bold}
        .container{padding:15px;max-width:1400px;margin:0 auto}
        .card{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,0.05)}
        .stats{display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:10px;margin-bottom:15px}
        .stat{background:#fff;padding:15px;border-radius:10px;text-align:center;border-bottom:4px solid #1F4E78}
        .stat .lbl{font-size:9px;color:#888;text-transform:uppercase}
        .stat .val{font-size:20px;font-weight:bold;color:#1F4E78}
        table{width:100%;border-collapse:collapse}
        th{background:#f8f9fa;padding:10px;text-align:left;color:#555;font-size:10px;border-bottom:2px solid #eee}
        td{padding:10px;border-bottom:1px solid #f0f0f0}
        input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;margin-bottom:10px;font-size:13px}
        label{display:block;font-size:10px;font-weight:bold;color:#444;margin-bottom:3px}
        .btn{background:#1F4E78;color:#fff;border:none;padding:12px 20px;border-radius:6px;cursor:pointer;font-weight:bold}
        .btn-sec{background:#6c757d}
        .hidden{display:none}
        .badge{padding:2px 6px;border-radius:8px;font-size:9px;font-weight:bold}
        .bg-red{background:#FCEBEB;color:#E24B4A}
        .bg-orange{background:#FFF3CD;color:#856404}
        .bg-green{background:#EAF3DE;color:#639922}
        .cell-ok{background:#f9fff0;border-left:3px solid #639922;padding:5px;cursor:pointer}
    </style>
</head>
<body>

<div class="nav">
    <h2 style="margin-right:20px;font-size:18px">Rentamaq <small style="font-size:10px;opacity:0.8">v3.8 Analista</small></h2>
    <button onclick="show('dash')" id="n-dash" class="active">Dashboard</button>
    <button onclick="show('grid')" id="n-grid">Grilla</button>
    <button onclick="show('new')" id="n-new">Reportar</button>
    <button onclick="show('cons')" id="n-cons">Consolidados</button>
    <button onclick="show('equipos')" id="n-equipos">Flota</button>
</div>

<div class="container">
    <div id="view-dash">
        <div class="stats">
            <div class="stat"><div class="lbl">H. Motor (Mes)</div><div id="s-hrs" class="val">0</div></div>
            <div class="stat"><div class="lbl">H. Efectivas (Mes)</div><div id="s-hef" class="val">0</div></div>
            <div class="stat"><div class="lbl">Sin Foto</div><div id="s-nofoto" class="val" style="color:#BA7517">0</div></div>
            <div class="stat"><div class="lbl">Turnos Faltantes (7d)</div><div id="s-miss" class="val" style="color:#c33">0</div></div>
        </div>
        <div class="card">
            <h3>Estado de Reportabilidad por Equipo</h3>
            <table id="t-dash" style="margin-top:10px">
                <thead>
                    <tr>
                        <th>Patente</th>
                        <th>Tipo</th>
                        <th>Horo Actual</th>
                        <th>H. Mes</th>
                        <th>Sin Foto</th>
                        <th>Faltantes (7d)</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="view-grid" class="hidden">
        <div class="card">
            <div style="display:flex; gap:10px; margin-bottom:15px">
                <select id="sel-eq" onchange="renderGrid()" style="flex:2"></select>
                <input type="date" id="per-ini" onchange="renderGrid()" style="flex:1">
                <input type="date" id="per-fin" onchange="renderGrid()" style="flex:1">
            </div>
            <div id="grid-body" style="overflow-x:auto"></div>
        </div>
    </div>

    <div id="view-new" class="hidden">
        <div class="card" style="max-width:600px; margin:auto">
            <h2 id="f-title" style="margin-bottom:15px">Ingresar Reporte</h2>
            <form onsubmit="saveReport(event)">
                <input type="hidden" id="f-id">
                <label>Equipo</label><select id="f-eq" required onchange="cargarHoroInicial()"></select>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px">
                    <div><label>Fecha</label><input type="date" id="f-fecha" required></div>
                    <div><label>Turno</label><select id="f-turno"><option>Día</option><option>Noche</option></select></div>
                </div>
                <label>Operador</label><input type="text" id="f-op" required>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px">
                    <div><label>H. Inicial</label><input type="number" step="0.1" id="f-hi" required></div>
                    <div><label>H. Final</label><input type="number" step="0.1" id="f-hf" required></div>
                    <div><label>H. Efectivas</label><input type="number" step="0.1" id="f-hef" required placeholder="HEF"></div>
                </div>
                <label>Folio Hoja</label><input type="text" id="f-folio">
                <label>Observaciones del Turno</label><textarea id="f-obs" rows="2" placeholder="Describa fallas, esperas o novedades..."></textarea>
                <label>Foto Reporte (Obligatorio para EDP)</label><input type="file" id="f-foto" accept="image/*" onchange="previewImg(event)">
                <div id="prev-foto"></div>
                <div style="display:flex; gap:10px; margin-top:15px">
                    <button type="button" class="btn btn-sec" onclick="clearForm(); show('dash')">Cancelar</button>
                    <button type="submit" class="btn" id="btn-save" style="flex:1">Guardar Reporte</button>
                </div>
            </form>
        </div>
    </div>

    <div id="view-cons" class="hidden">
        <div class="card">
            <div style="display:flex; gap:10px; margin-bottom:15px">
                <input type="date" id="c-ini">
                <input type="date" id="c-fin">
                <button class="btn" onclick="exportExcel()">Exportar Excel</button>
            </div>
            <div id="cons-body"></div>
        </div>
    </div>

    <div id="view-equipos" class="hidden">
        <div class="card">
            <button class="btn" onclick="abrirModalEq()">+ Agregar Equipo</button>
            <table id="t-eq" style="margin-top:15px">
                <thead><tr><th>Patente</th><th>Tipo</th><th>Horómetro</th><th>Acción</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal-box" id="modal-content"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBkIwhQMJbRdheMtsPcf2iFR0HPrOMW-h0",
    authDomain: "app-reportabilidad.firebaseapp.com",
    projectId: "app-reportabilidad",
    storageBucket: "app-reportabilidad.appspot.com",
    messagingSenderId: "423911487944",
    appId: "1:423911487944:web:abbf3c7464bb335bfc28fd"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

let reports = [], equipos = [], ausencias = [], fotoBase64 = null;

// ESCUCHADORES NUBE
db.collection("equipos").onSnapshot(s => { 
    equipos = s.docs.map(d => d.data()); 
    llenarSelects(); renderEquipos(); renderDash(); 
});
db.collection("reportes").onSnapshot(s => { 
    reports = s.docs.map(d => d.data()); 
    renderDash(); if(!document.getElementById('view-grid').classList.contains('hidden')) renderGrid();
});
db.collection("ausencias").onSnapshot(s => { 
    ausencias = s.docs.map(d => d.data()); 
    renderDash(); if(!document.getElementById('view-grid').classList.contains('hidden')) renderGrid();
});

function show(v){
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('view-'+v).classList.remove('hidden');
    document.getElementById('n-'+v)?.classList.add('active');
}

function todayS(){ return new Date().toISOString().split('T')[0]; }

// DASHBOARD ANALÍTICO
function renderDash(){
    const hoy = new Date();
    const hace7 = new Date(); hace7.setDate(hoy.getDate() - 6);
    let totalH = 0, totalHEF = 0, totalNoFoto = 0, totalMiss = 0;

    document.querySelector('#t-dash tbody').innerHTML = equipos.map(e => {
        const r_mes = reports.filter(r => r.equipo === e.patente);
        const h_mes = r_mes.reduce((a,b) => a + (b.hf - b.hi), 0);
        const hef_mes = r_mes.reduce((a,b) => a + parseFloat(b.hef || 0), 0);
        const no_foto = r_mes.filter(r => !r.foto).length;
        
        // Calcular Faltantes últimos 7 días
        let faltantes = 0;
        for(let i=0; i<7; i++){
            let d = new Date(hace7); d.setDate(d.getDate() + i);
            let fs = d.toISOString().split('T')[0];
            ['Día','Noche'].forEach(t => {
                const tiene = reports.find(r => r.equipo === e.patente && r.fecha === fs && r.turno === t);
                const aus = ausencias.find(a => a.equipo === e.patente && a.fecha === fs && a.turno === t);
                if(!tiene && !aus && fs <= todayS()) faltantes++;
            });
        }

        totalH += h_mes; totalHEF += hef_mes; totalNoFoto += no_foto; totalMiss += faltantes;

        return `<tr>
            <td><b>${e.patente}</b></td>
            <td>${e.tipo}</td>
            <td>${e.horo}</td>
            <td>${h_mes.toFixed(1)}</td>
            <td class="${no_foto>0?'bg-orange':''}">${no_foto}</td>
            <td class="${faltantes>0?'bg-red':''}">${faltantes}</td>
            <td><span class="badge ${faltantes===0?'bg-green':'bg-red'}">${faltantes===0?'AL DÍA':'GAP'}</span></td>
        </tr>`;
    }).join('');

    document.getElementById('s-hrs').textContent = totalH.toFixed(1);
    document.getElementById('s-hef').textContent = totalHEF.toFixed(1);
    document.getElementById('s-nofoto').textContent = totalNoFoto;
    document.getElementById('s-miss').textContent = totalMiss;
    document.getElementById('s-eq').textContent = equipos.length;
}

// GRILLA CON DETALLES
function renderGrid(){
    const pat = document.getElementById('sel-eq').value;
    if(!pat) return;
    const ini = document.getElementById('per-ini').value || todayS();
    const fin = document.getElementById('per-fin').value || todayS();
    const d1 = new Date(ini+'T00:00'), d2 = new Date(fin+'T00:00');
    
    let html = `<table><thead><tr><th>Fecha</th><th>Turno Día</th><th>Turno Noche</th></tr></thead><tbody>`;
    for(let d = new Date(d1); d <= d2; d.setDate(d.getDate()+1)){
        const fs = d.toISOString().split('T')[0];
        const celda = (t) => {
            const r = reports.find(x => x.equipo === pat && x.fecha === fs && x.turno === t);
            const a = ausencias.find(x => x.equipo === pat && x.fecha === fs && x.turno === t);
            if(r) return `<td><div class="cell-ok" onclick="editarReport('${r.id}')">
                <b>${(r.hf-r.hi).toFixed(1)}h</b> | ${r.hef}h ef.<br>
                <small>${r.foto?'📷':'🚫'} F:${r.folio||'SF'}</small>
            </div></td>`;
            if(a) return `<td><div class="cell-just" onclick="borrarAusencia('${a.id}')"><b>${a.motivo}</b></div></td>`;
            if(fs > todayS()) return `<td><div style="color:#ccc;text-align:center">-</div></td>`;
            return `<td><div class="cell-miss" onclick="opcionesFaltante('${pat}','${fs}','${t}')"><b>FALTA</b></div></td>`;
        };
        html += `<tr><td>${fs}</td>${celda('Día')}${celda('Noche')}</tr>`;
    }
    document.getElementById('grid-body').innerHTML = html + `</tbody></table>`;
}

// MODAL GESTION
function opcionesFaltante(p, f, t){
    document.getElementById('modal-content').innerHTML = `
        <h3>Gestionar Turno</h3><br>
        <button class="btn" style="width:100%; margin-bottom:10px" onclick="irAReportar('${p}','${f}','${t}')">Ingresar Reporte</button>
        <button class="btn btn-sec" style="width:100%" onclick="abrirFormAusencia('${p}','${f}','${t}')">Justificar Ausencia</button>
    `;
    document.getElementById('modal').classList.add('show');
}

function abrirFormAusencia(p, f, t){
    document.getElementById('modal-content').innerHTML = `
        <h3>Justificar Ausencia</h3><br>
        <select id="a-mot"><option>Mantención</option><option>Falla Mecánica</option><option>Clima</option><option>Sin Operador</option><option>Stand-by</option></select>
        <button class="btn" style="width:100%" onclick="guardarAusencia('${p}','${f}','${t}')">Guardar</button>
    `;
}

async function guardarAusencia(p, f, t){
    await db.collection("ausencias").add({ equipo: p, fecha: f, turno: t, motivo: document.getElementById('a-mot').value });
    closeModal();
}

// FORMULARIO
function cargarHoroInicial(){
    const e = equipos.find(x => x.patente === document.getElementById('f-eq').value);
    if(e) document.getElementById('f-hi').value = e.horo;
}

function previewImg(e){
    const reader = new FileReader();
    reader.onload = ev => {
        document.getElementById('prev-foto').innerHTML = `<img src="${ev.target.result}" style="max-width:100px;margin-top:10px">`;
        fotoBase64 = ev.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
}

async function saveReport(ev){
    ev.preventDefault();
    const btn = document.getElementById('btn-save'); btn.disabled = true;
    const id = document.getElementById('f-id').value || "rep_"+Date.now();
    const pat = document.getElementById('f-eq').value;
    const hf = parseFloat(document.getElementById('f-hf').value);
    
    let url = reports.find(r => r.id === id)?.foto || "";
    if(document.getElementById('f-foto').files[0]){
        const ref = storage.ref(`fotos/${id}.jpg`);
        await ref.put(document.getElementById('f-foto').files[0]);
        url = await ref.getDownloadURL();
    }

    const data = {
        id, equipo: pat, fecha: document.getElementById('f-fecha').value,
        turno: document.getElementById('f-turno').value, operador: document.getElementById('f-op').value,
        hi: parseFloat(document.getElementById('f-hi').value), hf, 
        hef: document.getElementById('f-hef').value, folio: document.getElementById('f-folio').value,
        obs: document.getElementById('f-obs').value, foto: url
    };

    await db.collection("reportes").doc(id).set(data);
    await db.collection("equipos").doc(pat).update({ horo: hf });

    alert("Guardado ✓"); clearForm(); show('dash');
}

function editarReport(id){
    const r = reports.find(x => x.id === id);
    if(!r) return;
    document.getElementById('f-id').value = r.id;
    document.getElementById('f-eq').value = r.equipo;
    document.getElementById('f-fecha').value = r.fecha;
    document.getElementById('f-turno').value = r.turno;
    document.getElementById('f-hi').value = r.hi;
    document.getElementById('f-hf').value = r.hf;
    document.getElementById('f-hef').value = r.hef || "";
    document.getElementById('f-op').value = r.operador;
    document.getElementById('f-folio').value = r.folio || "";
    document.getElementById('f-obs').value = r.obs || "";
    if(r.foto) document.getElementById('prev-foto').innerHTML = `<img src="${r.foto}" style="max-width:100px">`;
    show('new');
}

function exportExcel(){
    const data = reports.map(r => ({
        Fecha: r.fecha, Turno: r.turno, Equipo: r.equipo, H_Ini: r.hi, H_Fin: r.hf, 
        Motor: (r.hf-r.hi).toFixed(1), Efectivas: r.hef, Operador: r.operador, 
        Folio: r.folio, Observaciones: r.obs, Link: r.foto
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Reports");
    XLSX.writeFile(wb, "Rentamaq_Pro_Export.xlsx");
}

// INICIALIZACION
function llenarSelects(){
    const opts = '<option value="">— Seleccionar —</option>' + equipos.map(e => `<option value="${e.patente}">${e.patente}</option>`).join('');
    document.getElementById('f-eq').innerHTML = opts;
    document.getElementById('sel-eq').innerHTML = opts;
}
function clearForm(){ document.getElementById('f-id').value=""; document.getElementById('prev-foto').innerHTML=""; document.getElementById('btn-save').disabled=false; }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function showView(v){ show(v); }
document.getElementById('f-fecha').value = todayS();
</script>
</body>
</html>
